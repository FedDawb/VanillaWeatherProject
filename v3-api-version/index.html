<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Application</title>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Axios for API calls -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="font-[Poppins,sans-serif]">
    <!-- Main container for the weather app -->
    <div id="weather-container" class="weather-app max-w-6xl mx-auto my-10 p-4 sm:p-6 lg:p-8">
        <div class="mx-auto">
            <header class="mb-8">
                <!-- Search Form -->
                <form class="search-form flex gap-2 mb-4" id="search-form">
                    <input
                        type="search"
                        placeholder="Enter a City.."
                        required
                        id="search-form-input"
                        class="search-form-input w-full px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400"
                    />
                    <input
                        type="submit"
                        value="Search"
                        class="search-form-button px-6 py-2 rounded-lg cursor-pointer transition-colors"
                    />
                </form>
                <span id="error-message" class="text-red-500 mt-2"></span>
                <span id="loading-message" class="hidden">Loading...</span>

                <!-- Search History -->
                <div class="search-history-container mt-4 p-4 data-panel rounded-lg">
                    <h3 class="text-lg font-semibold mb-2">Search History</h3>
                    <ul id="search-history" class="search-history-list flex flex-wrap gap-2"></ul>
                </div>
            </header>

            <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Left Column: Main Weather Display -->
                <div class="lg:col-span-1 flex flex-col gap-6 data-panel rounded-xl p-6 shadow-lg">
                    <!-- City details -->
                    <div class="weather-app-data">
                        <h1 class="weather-app-city text-4xl font-bold" id="city">Loading...</h1>
                        <p class="weather-app-details text-gray-600 mt-2">
                            <strong id="time"></strong>,
                            <span id="description" class="capitalize"></span><br />
                            Humidity: <strong id="humidity"></strong>,
                            Wind: <strong id="wind-speed"></strong>
                        </p>
                    </div>

                    <!-- Temperature display -->
                    <div class="weather-app-temperature-container flex items-center justify-center gap-4 text-center my-4">
                        <div id="icon" class="text-7xl w-20 h-20 flex items-center justify-center"></div>
                        <div class="weather-app-temperature text-8xl font-bold" id="temperature"></div>
                        <div class="weather-app-unit text-3xl self-start mt-3">°C</div>
                    </div>

                    <!-- Unit Toggle Switch -->
                    <div class="unit-toggle-container flex items-center justify-center gap-3">
                        <span>°C</span>
                        <label class="switch">
                            <input type="checkbox" id="unit-toggle-checkbox" />
                            <span class="slider round"></span>
                        </label>
                        <span>°F</span>
                    </div>
                </div>

                <!-- Right Column: 5-Day Forecast -->
                <div class="lg:col-span-2 data-panel rounded-xl p-6 shadow-lg">
                    <h2 class="text-2xl font-bold mb-4">5-Day Forecast</h2>
                    <!-- The forecast items will be laid out horizontally inside this grid -->
                    <div id="forecast" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4 text-center">
                        <!-- Forecast items will be dynamically injected here by script.js -->
                    </div>
                </div>
            </main>

            <footer class="text-center mt-8 py-4 text-gray-700 text-sm">
                Built by
                <a href="https://github.com/FedDawb" target="_blank" class="underline hover:text-black">Dawn Hughes</a> –
                hosted on
                <a href="https://app.netlify.com/sites/fedawbweatherapp/overview" target="_blank" class="underline hover:text-black">Netlify</a>
                – code on
                <a href="https://github.com/FedDawb/VanillaWeatherProject" target="_blank" class="underline hover:text-black">GitHub</a>
            </footer>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
